
name: Update GitHub Profile Statistics

on:
  schedule:
    # Update every day at 00:00 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub statistics
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=transparent&include_all_commits=true&rank_icon=github&title_color=A78BFA&icon_color=A78BFA&text_color=C9D1D9&bg_color=0D1117
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&layout=compact&hide_border=true&langs_count=6&theme=transparent&title_color=A78BFA&text_color=C9D1D9&bg_color=0D1117
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "chore: update GitHub profile statistics" || exit 0

          git push
